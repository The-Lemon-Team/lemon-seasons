events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    upstream backend_upstream {
        server host.docker.internal:3001;
    }

    upstream feed_upstream {
        server feed-app:80;
    }

    upstream calendar_upstream {
        server calendar-app:80;
    }

    upstream admin_upstream {
        server admin-cms:80;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # 1. API & Backend Endpoints
        location ~ ^/(notes|feeds|taxonomy|hashtags|folders|sync|storage|uploads|keys|containers|health|stats|api|ingestion) {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # 2. Calendar App Subpath
        location ^~ /calendar/ {
            rewrite ^/calendar/(.*)$ /$1 break;
            proxy_pass http://calendar_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Admin CMS Subpath
        location ^~ /admin/ {
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Feed App (Root Frontend)
        location / {
            proxy_pass http://feed_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
