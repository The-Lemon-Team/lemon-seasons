version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lemon-seasons-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lemon_secret}
      POSTGRES_DB: ${POSTGRES_DB:-lemon_seasons}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lemon} -d ${POSTGRES_DB:-lemon_seasons}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
