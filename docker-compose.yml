version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lemon-calendarium-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lemon_secret}
      POSTGRES_DB: ${POSTGRES_DB:-lemon_calendarium}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lemon} -d ${POSTGRES_DB:-lemon_calendarium}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: lemon-calendarium-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lemon}:${POSTGRES_PASSWORD:-lemon_secret}@postgres:5432/${POSTGRES_DB:-lemon_calendarium}?schema=public&connection_limit=10&pool_timeout=20
      PORT: 3001
      NODE_ENV: production
      SPARKS_INCOMING_DIR: /app/sparks
      GDRIVE_SYNC_FOLDER: /app/gdrive
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - backend_uploads:/app/apps/backend/uploads
      - "${SPARKS_HOST_DIR:-C:/Users/Ilege/Мой диск/spark}:/app/sparks"
      - "${GDRIVE_SYNC_FOLDER:-C:/remote}:/app/gdrive"

  feed-app:
    build:
      context: .
      dockerfile: apps/feed-app/Dockerfile
    container_name: lemon-calendarium-feed
    restart: unless-stopped
    ports:
      - "5175:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 64M

  calendar-app:
    build:
      context: .
      dockerfile: apps/calendar-app/Dockerfile
    container_name: lemon-calendarium-calendar
    restart: unless-stopped
    ports:
      - "5174:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 64M

  admin-cms:
    build:
      context: .
      dockerfile: apps/admin-cms/Dockerfile
    container_name: lemon-calendarium-admin
    restart: unless-stopped
    ports:
      - "5173:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 64M

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: lemon-calendarium-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - feed-app
      - calendar-app
      - admin-cms
    deploy:
      resources:
        limits:
          memory: 64M

  container-sync-server:
    build:
      context: ./packages/obsidian-containers
      dockerfile: packages/server/Dockerfile
    container_name: obsidian-sync-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VAULT_STORAGE_PATH=/app/data/vault
      - GIT_USER_NAME=Obsidian Sync Engine
      - GIT_USER_EMAIL=sync@obsidian.local
      - API_KEY=${CONTAINER_API_KEY:-}
    volumes:
      - obsidian_sync_data:/app/data

volumes:
  postgres_data:
  backend_uploads:
  obsidian_sync_data:
