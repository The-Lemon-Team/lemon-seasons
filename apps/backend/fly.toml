# Fly.io Configuration for Lemon Seasons Backend & Cloud Bus Hub
# https://fly.io/docs/reference/configuration/

app = "lemon-seasons-backend"
primary_region = "fra" # Frankfurt (low latency to Europe/CIS)

[build]
  dockerfile = "apps/backend/Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  ENABLE_LOCAL_FS_WATCHER = "false"
  LEMON_BUS_DRIVER = "supabase"
  DEVICE_ID = "fly-cloud-bus"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 500

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Optional Persistent NVMe Volume for local bus cache/buffer
# To attach volume, run: fly volumes create lemon_bus_data --size 3
[mounts]
  source = "lemon_bus_data"
  destination = "/data"
  initial_size = "3gb"
