<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lemon Seasons admin - Quick Add</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Jetbrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

tbrains Mono"]}, fontSize: {"code-md": ["13px", {lineHeight: "1.5", fontWeight: "400"}], metadata: ["12px", {lineHeight: "1.4", fontWeight: "400"}], "body-lg": ["16px", {lineHeight: "1.6", fontWeight: "400"}], "body-md": ["14px", {lineHeight: "1.5", fontWeight: "400"}], "headline-md": ["24px", {lineHeight: "1.3", fontWeight: "600"}], "label-caps": ["11px", {lineHeight: "1.2", letterSpacing: "0.05em", fontWeight: "600"}], "headline-sm": ["18px", {lineHeight: "1.4", fontWeight: "600"}], display: ["32px", {lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "600"}]}}}};</script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
        }
        /* Custom scrollbar for textarea */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2); 
        }
        /* Focus ring for inputs */
        .input-focus-ring:focus-within {
            border-color: theme('colors.primary');
            box-shadow: 0 0 0 2px rgba(240, 176, 255, 0.2);
        }
        /* Modal Backdrop Blur */
        .modal-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-background/80 modal-backdrop z-50 flex items-center justify-center p-4 sm:p-6" id="quickAddModal">
<!-- Modal Container (Level 2 Elevation) -->
<div class="bg-surface-container-high rounded-xl border border-white/10 shadow-[0px_10px_30px_rgba(0,0,0,0.5)] w-full max-w-2xl overflow-hidden flex flex-col relative transition-all duration-300 transform scale-100 opacity-100">
<!-- Header -->
<div class="px-container-padding py-stack-md border-b border-white/5 flex items-center justify-between bg-surface-container-highest/50">
<div class="flex items-center gap-3">
<img alt="Lemon Seasons Logo" class="w-6 h-6 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDNX5nDL0p4l-WluydDzxL2yTb2MO3t5xS9oY6VapP77xNVzVNfzlHBVCCy0BeRd4qCHs2F61wJ_usFi_-oCAQlKXHtC_qVqbgECvMUBjC02vEwKEhFNdCkv4CciqVHinl23lMyLsw5t8Nsanr2GJz7Scr1w-JUwSLbVdXV9gB_78S-K8e_2exgIJpAaMfME1ReCQI2IKghefqoPCEZn-DVSu5YmPTyodBNvWR2spg0LEdHamvgcFQT"/>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Lemon Seasons admin: Quick Add Note</h2>
</div>
<button aria-label="Close" class="text-on-surface-variant hover:text-on-surface transition-colors p-1 rounded-md hover:bg-white/5" onclick="document.getElementById('quickAddModal').style.display='none'">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Form Content -->
<div class="p-container-padding flex-1 overflow-y-auto space-y-stack-lg">
<!-- Title & Type Row -->
<div class="grid grid-cols-1 md:grid-cols-[1fr_200px] gap-gutter">
<!-- Title -->
<div class="space-y-stack-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="title">Title</label>
<div class="relative rounded-lg border border-white/10 bg-surface-container-lowest input-focus-ring transition-all duration-200">
<input class="w-full bg-transparent border-none py-2.5 px-3 text-on-surface font-body-md text-body-md placeholder:text-outline-variant focus:ring-0 rounded-lg" id="title" name="title" placeholder="Enter note title..." type="text"/>
</div>
</div>
<!-- Note Type Select -->
<div class="space-y-stack-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="noteType">Type</label>
<div class="relative rounded-lg border border-white/10 bg-surface-container-lowest input-focus-ring transition-all duration-200">
<select class="w-full bg-transparent border-none py-2.5 pl-3 pr-8 text-on-surface font-code-md text-code-md appearance-none focus:ring-0 rounded-lg cursor-pointer" id="noteType" name="noteType">
<option class="bg-surface-container text-on-surface" value="SINGLE">SINGLE</option>
<option class="bg-surface-container text-on-surface" value="PERIOD">PERIOD</option>
<option class="bg-surface-container text-on-surface" value="EVENT">EVENT</option>
<option class="bg-surface-container text-on-surface" value="FILM_RELEASE">FILM_RELEASE</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Description (Markdown) -->
<div class="space-y-stack-sm">
<div class="flex items-center justify-between">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="description">Description</label>
<span class="font-metadata text-metadata text-outline-variant bg-surface-container-lowest px-2 py-0.5 rounded-sm border border-white/5">Markdown Supported</span>
</div>
<div class="relative rounded-lg border border-white/10 bg-surface-container-lowest input-focus-ring transition-all duration-200">
<textarea class="w-full bg-transparent border-none py-3 px-3 text-on-surface font-code-md text-code-md placeholder:text-outline-variant focus:ring-0 rounded-lg resize-y min-h-[120px]" id="description" name="description" placeholder="# Start typing..." rows="5"></textarea>
</div>
</div>
<!-- Date Range & Tags Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Date Range -->
<div class="space-y-stack-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Date Range</label>
<div class="flex items-center gap-2">
<!-- Start Date -->
<div class="relative rounded-lg border border-white/10 bg-surface-container-lowest input-focus-ring transition-all duration-200 flex-1">
<div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">calendar_today</span>
</div>
<input class="w-full bg-transparent border-none py-2 pl-9 pr-2 text-on-surface font-code-md text-code-md focus:ring-0 rounded-lg [color-scheme:dark]" id="startDate" name="startDate" type="date"/>
</div>
<span class="text-on-surface-variant font-metadata text-metadata">-</span>
<!-- End Date -->
<div class="relative rounded-lg border border-white/10 bg-surface-container-lowest input-focus-ring transition-all duration-200 flex-1">
<div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">calendar_today</span>
</div>
<input class="w-full bg-transparent border-none py-2 pl-9 pr-2 text-on-surface font-code-md text-code-md focus:ring-0 rounded-lg [color-scheme:dark]" id="endDate" name="endDate" type="date"/>
</div>
</div>
</div>
<!-- Tags (Ltree paths) -->
<div class="space-y-stack-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="tags">Taxonomy Path</label>
<div class="relative rounded-lg border border-white/10 bg-surface-container-lowest input-focus-ring transition-all duration-200">
<div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">account_tree</span>
</div>
<input class="w-full bg-transparent border-none py-2.5 pl-9 pr-3 text-on-surface font-code-md text-code-md placeholder:text-outline-variant focus:ring-0 rounded-lg" id="tags" name="tags" placeholder="root.category.subcategory" type="text"/>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="px-container-padding py-stack-md border-t border-white/5 bg-surface-container-highest/30 flex justify-end gap-3">
<button class="px-4 py-2 rounded-lg font-body-md text-body-md font-medium text-on-surface-variant hover:text-on-surface hover:bg-white/5 transition-colors" onclick="document.getElementById('quickAddModal').style.display='none'" type="button">
                    Cancel
                </button>
<button class="px-5 py-2 rounded-lg font-body-md text-body-md font-medium bg-primary/10 text-primary border border-primary/20 hover:bg-primary/20 hover:border-primary/30 transition-all duration-200 shadow-[0_2px_10px_rgba(240,176,255,0.05)] hover:shadow-[0_4px_15px_rgba(240,176,255,0.1)] flex items-center gap-2" type="submit">
<span class="material-symbols-outlined text-[18px]">save</span>
                    Save Entry
                </button>
</div>
</div>
</div>
</body></html>
